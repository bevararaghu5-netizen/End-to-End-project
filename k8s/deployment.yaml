@"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops
  template:
    metadata:
      labels:
        app: devops
    spec:
      containers:
      - name: devops-container
        image: devops-web:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
"@ | Set-Content k8s/deployment.yaml